<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>章节主线 · DELTARUNE 场景编辑器 V1.0</title><link rel="stylesheet" href="/studio/studio.css"><link rel="stylesheet" href="/studio/chapters.css"></head>
<body><header class="top"><div class="brand"><span class="logo">✦</span><div><small>DELTARUNE DIRECTOR</small><strong>章节主线</strong></div></div><nav><a href="/">场景编辑器</a></nav></header>
<main id="chapterWorkspace" inert><div class="toolbar"><label>工程 <select id="chapter"><option value="5">第 5 章</option><option value="4">第 4 章</option></select></label><div class="cluster"><button id="build">生成试玩</button><button class="primary" id="play">▶ 工作台内试玩</button></div><output id="status" role="status">载入中…</output></div>
<section id="gamePanel" hidden><div class="inline"><h2>章节试玩</h2><button id="endGame">结束试玩</button></div><canvas id="gameView" width="640" height="480" tabindex="0" aria-label="章节试玩，方向键移动，Z 确认，X 取消，C 菜单"></canvas>
<div class="game-pad"><button data-native="left">←</button><button data-native="up">↑</button><button data-native="down">↓</button><button data-native="right">→</button><button data-native="act">Z 确认</button><button data-native="cancel">X 取消</button><button data-native="menu">C 菜单</button></div><details id="autonav" open><summary>AI 自动跑图</summary>
<div class="nav-controls"><label>任务<select id="navMode"><option value="target">前往指定房间</option><option value="explore">探索未到过的房间</option><option value="route">依次前往主线节点</option></select></label>
<label id="navGoalLabel">目的地<select id="navGoal"></select></label><button type="button" id="navStart" class="primary">开始跑图</button><button type="button" id="navResume" hidden>继续原路线</button><button type="button" id="navStop" disabled>暂停 / 接管</button></div>
<div class="nav-options"><label><input type="checkbox" id="navTalk" checked>自动翻对话</label><label><input type="checkbox" id="navChoice">遇到选项选第一项</label></div>
<p id="navInfo" role="status">进入可行走的场景后开始。试玩画布内按方向键即可接管。</p><div id="navRoute"></div></details></section>
<div class="chapter-grid"><aside><section><h2>地图与人物</h2><label>查找房间<input id="filter" type="search" placeholder="输入房间名"></label><select size="13" id="rooms" aria-label="房间"></select><label>房间内的物件<select id="instances" size="9"></select></label><div class="inline"><label>X<input type="number" id="x"></label><label>Y<input type="number" id="y"></label><button id="position">保存位置</button></div></section></aside>
<div><section><h2 id="roomTitle">房间</h2><button id="preview" hidden>从本段预演</button><canvas id="plan" width="720" height="290" aria-label="物件平面图，点击选择物件"></canvas><output id="objectInfo"></output></section>
<section><h2>事件脚本</h2><label>查找全章脚本<input id="query" type="search" placeholder="输入控制器名，如 LW01 或 plat_player"></label><select id="events" aria-label="关联与匹配脚本"></select><label>定位条件、换房或演出指令<select id="stops"><option>选择脚本后显示</option></select></label><textarea id="source" spellcheck="false" rows="16" aria-label="GML 事件源码"></textarea><div class="inline"><button id="save">保存脚本</button><button id="original">恢复原文到编辑区</button></div></section></div>
<aside><section><h2>主线节点</h2><div id="milestones"></div></section><section><h2>试玩轨迹</h2><button id="refresh">读取最近轨迹</button><button id="downloadRun">导出本次按键与路线</button><pre id="log"></pre></section></aside></div></main><script type="module" src="/studio/chapters.mjs"></script></body></html>
